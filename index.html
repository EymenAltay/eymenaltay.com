<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eymen Altay</title>
    <!-- Google Fonts üzerinden şık bir yazı tipi ekledik -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <!-- Instagram İkonu için FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at center, #1e1e24 0%, #0f0f12 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 20px;
            overflow: hidden;
        }

        /* Üst Kısım - İsim */
        header {
            text-align: center;
            margin-top: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #ff7b00, #ffae00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 20px rgba(255, 123, 0, 0.15);
        }

        /* Orta Kısım - Çalışma Var İçeriği */
        main {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
        }

        /* Dönen Şık Efekt (Spinner) */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.05);
            border-top: 4px solid #ff7b00;
            border-radius: 50%;
            width: 70px;
            height: 70px;
            animation: spin 1.5s linear infinite;
            margin-bottom: 30px;
            box-shadow: 0 0 15px rgba(255, 123, 0, 0.2);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        main h2 {
            font-size: 1.8rem;
            font-weight: 500;
            margin-bottom: 10px;
            color: #e0e0e0;
        }

        main p {
            font-size: 1rem;
            font-weight: 300;
            color: #888888;
            max-width: 400px;
            line-height: 1.6;
        }

        /* Alt Kısım - Instagram Butonu */
        footer {
            margin-bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .instagram-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 30px;
            background: linear-gradient(45deg, #405DE6, #5851DB, #833AB4, #C13584, #E1306C, #FD1D1D);
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(225, 48, 108, 0.4);
            transition: all 0.3s ease;
        }

        .instagram-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(225, 48, 108, 0.6);
        }

        .instagram-btn i {
            font-size: 1.2rem;
        }

        /* Mobil Uyumluluk Değişikliği */
        @media (max-width: 480px) {
            header h1 { font-size: 2rem; }
            main h2 { font-size: 1.4rem; }
            main p { font-size: 0.9rem; }
        }
    </style>
</head>
<body>

    <!-- Üst Orta: İsim -->
    <header>
        <h1>Eymen Altay</h1>
    </header>

    <!-- Orta Alan: Yapım Aşamasında Bilgisi -->
    <main>
        <div class="loader"></div>
        <h2>Çalışma Devam Ediyor</h2>
        <p>Sitemiz şu anda güncellenmektedir. Çok yakında yeni yüzümüzle hizmetinizdeyiz.</p>
    </main>

    <!-- Alt Kısım: Instagram Yönlendirmesi -->
    <footer>
        <a href="https://instagram.com/eymen.altay" target="_blank" class="instagram-btn">
            <i class="fab fa-instagram"></i> @eymen.altay
        </a>
    </footer>

</body>
</html>
